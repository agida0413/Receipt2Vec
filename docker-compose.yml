# =============================================================================
# rag-base Docker 실행 구성
#   docker compose up -d --build                       # OpenSearch + backend + ocr-backend
#   docker compose up -d --build ocr-backend           # OCR 서버만
#   docker compose --profile dashboards up -d --build  # + OpenSearch Dashboards(5601)
# 설정값은 rag_backend/.env 를 그대로 사용하고, 컨테이너 간 접속 정보만 아래에서 덮어씀
# =============================================================================
name: rag-base

services:
  opensearch:
    build:
      context: ./docker/opensearch
      args:
        OPENSEARCH_VERSION: ${OPENSEARCH_VERSION:-2.19.2}
    image: ragbase-opensearch-nori:${OPENSEARCH_VERSION:-2.19.2}
    container_name: ragbase-opensearch
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=${OPENSEARCH_JAVA_OPTS:--Xms1g -Xmx1g}
      # 로컬 개발용: 보안 플러그인 비활성화 (backend가 http/무인증으로 접속)
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - DISABLE_SECURITY_PLUGIN=true
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    ports:
      - "${OPENSEARCH_PUBLISH_PORT:-9200}:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  dashboards:
    image: opensearchproject/opensearch-dashboards:${OPENSEARCH_VERSION:-2.19.2}
    container_name: ragbase-dashboards
    profiles: ["dashboards"]
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    ports:
      - "5601:5601"
    depends_on:
      opensearch:
        condition: service_healthy

  backend:
    build:
      context: ./rag_backend
    image: rag-base-backend:latest
    container_name: ragbase-backend
    # rag_backend/.env.example 을 rag_backend/.env 로 복사해서 사용 (없으면 실행 오류)
    env_file:
      - ./rag_backend/.env
    environment:
      # 컨테이너 네트워크 내부 주소로 덮어씀 (.env의 localhost 값 무시)
      OPENSEARCH_HOST: opensearch
      OPENSEARCH_PORT: "9200"
      PORT: "3001"
      # uvicorn 은 UVICORN_* 환경변수를 자동으로 읽음. 워커마다 임베딩+리랭킹 모델(약 3GB)을
      # 따로 올리므로 .env 의 UVICORN_WORKERS 값과 무관하게 1로 고정 (메모리 부족 방지)
      UVICORN_WORKERS: "1"
    ports:
      - "${BACKEND_PUBLISH_PORT:-3001}:3001"
    volumes:
      # 임베딩/리랭킹 모델 캐시 (재시작 시 재다운로드 방지)
      - hf-cache:/models/huggingface
      # 적재 데이터(CSV) — 이미지 재빌드 없이 교체 가능
      - ./rag_backend/app/test:/app/app/test:ro
    depends_on:
      opensearch:
        condition: service_healthy
    restart: unless-stopped

  ocr-backend:
    build:
      context: ./ocr_backend
    image: receipt2vec-ocr-backend:latest
    container_name: receipt2vec-ocr-backend
    # ocr_backend/.env 는 선택 (없으면 config.py 기본값 사용)
    env_file:
      - path: ./ocr_backend/.env
        required: false
    environment:
      PORT: "3002"
    ports:
      - "${OCR_PUBLISH_PORT:-3002}:3002"
    volumes:
      # PaddleOCR 모델 캐시 (재시작 시 재다운로드 방지)
      - paddle-cache:/models/paddlex
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:3002/')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s
    restart: unless-stopped

volumes:
  opensearch-data:
  hf-cache:
  paddle-cache:
