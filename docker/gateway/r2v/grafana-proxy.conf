# Grafana 프록시 공통 설정 (app-locations.conf 의 /grafana/ location 들이 include)
include /etc/nginx/runtime/grafana-allow.conf;   # GRAFANA_ALLOW (start.sh 가 생성)
# location 에서 proxy_set_header 를 쓰면 server 설정이 상속되지 않음 → 필요한 것 다시 지정
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Request-ID $req_id;
proxy_set_header Upgrade $http_upgrade;          # 실시간(Live) WebSocket
proxy_set_header Connection $connection_upgrade;
proxy_read_timeout 120s;
proxy_pass http://grafana_pool;
