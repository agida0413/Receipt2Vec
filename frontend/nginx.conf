server {
    listen 80;
    client_max_body_size 20m;

    # 주소를 요청 시점에 Docker DNS 로 조회 (백엔드 컨테이너가 재생성돼 IP 가 바뀌어도 502 안 남)
    resolver 127.0.0.11 valid=10s ipv6=off;

    # OCR: 사진 인식, 사용자 확인, 확인된 거래 저장 → ocr_backend
    location /api/ocr/ {
        set $ocr_backend http://ocr-backend:3002;
        proxy_pass $ocr_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }

    # 챗봇(SSE)·거래 목록/삭제 → rag_backend. SSE 가 버퍼링되지 않도록 proxy_buffering off
    location /api/ {
        set $rag_backend http://backend:3001;
        proxy_pass $rag_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # 빌드 산출물(파일명에 해시 포함)은 오래 캐시
    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html 은 매번 확인 → 재배포 후 새로고침만 해도 새 화면 코드(새 API 경로)를 받음
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
