# 요청 ID: 클라이언트가 보낸 X-Request-ID 가 있으면 그대로, 없으면 nginx 가 생성 → 백엔드까지 같은 값으로 전달
map $http_x_request_id $req_id {
    default $http_x_request_id;
    ""      $request_id;
}

# 상태 코드 → 로그 레벨 (Grafana 에서 5xx 빨강, 4xx 노랑으로 보이도록 백엔드와 같은 형식)
map $status $log_level {
    ~^5     ERROR;
    ~^4     WARNING;
    default INFO;
}

log_format app '$time_iso8601 | $log_level | rid=$req_id | nginx | '
               'method=$request_method path=$uri status=$status ms=$request_time bytes=$body_bytes_sent '
               'upstream=$upstream_addr upstream_ms=$upstream_response_time client=$remote_addr '
               'ua="$http_user_agent"';

server {
    listen 80;
    client_max_body_size 20m;
    client_body_buffer_size 20m;   # 업로드 사진을 임시 파일 없이 메모리에서 처리 (매 업로드마다 경고 로그 방지)
    access_log /dev/stdout app;

    # 주소를 요청 시점에 Docker DNS 로 조회 (백엔드 컨테이너가 재생성돼 IP 가 바뀌어도 502 안 남)
    resolver 127.0.0.11 valid=10s ipv6=off;

    # OCR: 사진 인식, 사용자 확인, 확인된 거래 저장 → ocr_backend
    location /api/ocr/ {
        set $ocr_backend http://ocr-backend:3002;
        proxy_pass $ocr_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $req_id;
        proxy_read_timeout 300s;
        add_header X-Request-ID $req_id always;
    }

    # 챗봇(SSE)·거래 목록/삭제 → rag_backend. SSE 가 버퍼링되지 않도록 proxy_buffering off
    location /api/ {
        set $rag_backend http://backend:3001;
        proxy_pass $rag_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $req_id;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        add_header X-Request-ID $req_id always;
    }

    # 빌드 산출물(파일명에 해시 포함)은 오래 캐시, 정적 파일 접속 로그는 생략
    location /assets/ {
        root /usr/share/nginx/html;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html 은 매번 확인 → 재배포 후 새로고침만 해도 새 화면 코드(새 API 경로)를 받음
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
