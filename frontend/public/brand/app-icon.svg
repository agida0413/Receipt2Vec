<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Expense AI 앱 아이콘: 브랜드 보라 배경 + 영수증 + AI 반짝임 (OAuth 동의 화면·앱 등록용, 정사각 꽉 찬 배경) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5f6bea"/>
      <stop offset="1" stop-color="#3a43b8"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe28a"/>
      <stop offset="1" stop-color="#ffc23d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1b1f5e" flood-opacity=".28"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- 영수증 (아래 톱니) -->
  <path filter="url(#shadow)" fill="#ffffff"
        d="M156 392 V128 a16 16 0 0 1 16 -16 H340 a16 16 0 0 1 16 16 V392
           l-25 -18 l-25 18 l-25 -18 l-25 18 l-25 -18 l-25 18 l-25 -18 z"/>

  <!-- 품목 줄 -->
  <g stroke="#4f5bd5" stroke-width="18" stroke-linecap="round">
    <line x1="194" y1="176" x2="318" y2="176"/>
    <line x1="194" y1="218" x2="318" y2="218"/>
    <line x1="194" y1="260" x2="270" y2="260"/>
  </g>
  <!-- 합계 줄 -->
  <line x1="194" y1="314" x2="318" y2="314" stroke="#c9cdf6" stroke-width="6" stroke-linecap="round"/>
  <line x1="262" y1="344" x2="318" y2="344" stroke="#3a43b8" stroke-width="20" stroke-linecap="round"/>

  <!-- AI 반짝임 -->
  <path fill="url(#spark)" d="M372 72 Q376 132 432 136 Q376 140 372 200 Q368 140 312 136 Q368 132 372 72 Z"/>
  <path fill="#ffe28a" d="M424 196 Q426 218 446 220 Q426 222 424 244 Q422 222 402 220 Q422 218 424 196 Z"/>
</svg>
