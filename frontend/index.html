<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: 노치·홈 바 영역까지 그리고 safe-area 로 여백 처리
         interactive-widget=resizes-content: 안드로이드 크롬에서 키보드가 열리면 화면 높이를 줄여 입력창이 가려지지 않게 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#17181c" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="영수증과 결제내역을 올리면 지출을 찾아보고 계산해 주는 Expense AI" />
    <meta name="format-detection" content="telephone=no" />
    <!-- 홈 화면에 추가 (앱처럼 실행) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Expense AI" />
    <link rel="apple-touch-icon" href="/brand/app-icon-256.png" />
    <title>Receipt2Vec · Expense AI</title>
    <link rel="icon" href="/brand/app-icon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
