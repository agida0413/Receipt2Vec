# =============================================================================
# 운영(RAG 서버) 오버라이드: 저장소 루트 docker-compose.yml 위에 덮어씀
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# - 서버에서 빌드하지 않고 Docker Hub 이미지 사용 (IMAGE_REPO:<서비스>-<IMAGE_TAG>)
#   IMAGE_TAG 기본 latest → 배포할 때마다 최신 이미지를 pull (pull_policy: always)
#   롤백: Jenkins 에서 DEPLOY_TAG=<커밋 해시> 로 실행
# - 도메인·HTTPS: dev-ops/deploy/prod.env (DOMAIN=kyj.ai.kr)
#   gateway 80/443 공개, certbot 이 Let's Encrypt 인증서를 발급·12시간마다 갱신 확인
# - 외부 포트는 gateway(80/443)만. 백엔드·DB 포트를 닫아 모든 요청이 인증 검사(gateway)를 거치게 함
# - `!reset`/`!override` 는 Docker Compose 2.24.4+ 필요 (scripts/bootstrap-rag-host.sh 가 설치)
# =============================================================================
services:
  opensearch:
    image: ${IMAGE_REPO:?IMAGE_REPO 필요}:opensearch-${IMAGE_TAG:-latest}
    build: !reset null
    pull_policy: always
    ports: !reset []

  backend:
    image: ${IMAGE_REPO}:backend-${IMAGE_TAG:-latest}
    build: !reset null
    pull_policy: always
    ports: !reset []

  ocr-backend:
    image: ${IMAGE_REPO}:ocr-backend-${IMAGE_TAG:-latest}
    build: !reset null
    pull_policy: always
    ports: !reset []

  auth-server:
    image: ${IMAGE_REPO}:auth-server-${IMAGE_TAG:-latest}
    build: !reset null
    pull_policy: always
    ports: !reset []
    environment:
      # auth_server/.env 의 값보다 우선 (HTTPS 운영에서는 리프레시 토큰 쿠키를 Secure 로)
      COOKIE_SECURE: ${COOKIE_SECURE:-true}

  frontend:
    image: ${IMAGE_REPO}:frontend-${IMAGE_TAG:-latest}
    build: !reset null
    pull_policy: always

  mysql:
    ports: !reset []

  redis:
    ports: !reset []

  gateway:
    pull_policy: always
    ports: !override
      - "80:80"
      - "443:443"

  # Let's Encrypt 인증서 발급·갱신 (webroot 방식: gateway 가 /.well-known/acme-challenge 를 서비스)
  #   발급 실패(DNS 미설정·80 포트 막힘)면 10분마다 재시도, 발급 후에는 12시간마다 갱신 확인(만료 30일 전 갱신)
  certbot:
    image: certbot/certbot:v2.11.0
    container_name: ragbase-certbot
    environment:
      DOMAIN: ${DOMAIN:?prod.env 의 DOMAIN 필요}
      CERT_DOMAINS: ${CERT_DOMAINS:-${DOMAIN}}
      CERT_EMAIL: ${CERT_EMAIL:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        trap exit TERM
        EMAIL="--register-unsafely-without-email"
        [ -n "$$CERT_EMAIL" ] && EMAIL="--email $$CERT_EMAIL --no-eff-email"
        # DNS 가 실제로 조회되는 이름만 인증서에 넣음 (하나라도 안 풀리면 발급 전체가 실패하므로)
        resolvable() { python3 -c "import socket,sys; socket.gethostbyname(sys.argv[1])" "$$1" 2>/dev/null; }
        sleep 20
        while :; do
          ARGS=""; NAMES=""; SEEN=""
          for d in $$DOMAIN $$CERT_DOMAINS; do
            case " $$SEEN " in *" $$d "*) continue ;; esac
            SEEN="$$SEEN $$d"
            if resolvable "$$d"; then ARGS="$$ARGS -d $$d"; NAMES="$$NAMES $$d"
            else echo "[certbot] DNS 미조회 → 이번 발급에서 제외: $$d"; fi
          done
          case " $$NAMES " in
            *" $$DOMAIN "*)
              if certbot certonly --webroot -w /var/www/certbot --cert-name "$$DOMAIN" $$ARGS $$EMAIL \
                   --agree-tos --non-interactive --keep-until-expiring --expand; then
                echo "[certbot] 인증서 정상 ($$NAMES) → 12시간 후 다시 확인"
                sleep 12h & wait $$!; continue
              fi
              echo "[certbot] 발급 실패: 80 포트·DNS 를 확인하세요 → 10분 후 재시도" ;;
            *) echo "[certbot] 대표 주소 $$DOMAIN 의 DNS 가 아직 없음 → 10분 후 재시도" ;;
          esac
          sleep 10m & wait $$!
        done
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    depends_on:
      - gateway
    restart: unless-stopped
