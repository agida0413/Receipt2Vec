# =============================================================================
# 운영(RAG 서버) 오버라이드: 저장소 루트 docker-compose.yml 위에 덮어씀
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# - 서버에서 빌드하지 않고 Docker Hub 이미지 사용 (IMAGE_REPO:<서비스>-<IMAGE_TAG>)
#   IMAGE_TAG 기본 latest → 배포할 때마다 최신 이미지를 pull (pull_policy: always)
#   롤백: Jenkins 에서 DEPLOY_TAG=<커밋 해시> 로 실행
# - 외부 포트는 gateway(80)만. 백엔드·DB 포트를 닫아 모든 요청이 인증 검사(gateway)를 거치게 함
# - `!reset` 은 Docker Compose 2.24+ 필요 (scripts/bootstrap-rag-host.sh 가 설치)
# =============================================================================
services:
  opensearch:
    image: ${IMAGE_REPO:?IMAGE_REPO 필요}:opensearch-${IMAGE_TAG:-latest}
    build: !reset null
    pull_policy: always
    ports: !reset []

  backend:
    image: ${IMAGE_REPO}:backend-${IMAGE_TAG:-latest}
    build: !reset null
    pull_policy: always
    ports: !reset []

  ocr-backend:
    image: ${IMAGE_REPO}:ocr-backend-${IMAGE_TAG:-latest}
    build: !reset null
    pull_policy: always
    ports: !reset []

  auth-server:
    image: ${IMAGE_REPO}:auth-server-${IMAGE_TAG:-latest}
    build: !reset null
    pull_policy: always
    ports: !reset []

  frontend:
    image: ${IMAGE_REPO}:frontend-${IMAGE_TAG:-latest}
    build: !reset null
    pull_policy: always

  mysql:
    ports: !reset []

  redis:
    ports: !reset []

  gateway:
    pull_policy: always
